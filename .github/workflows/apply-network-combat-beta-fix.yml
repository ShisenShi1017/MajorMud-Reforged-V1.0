name: Apply Network Combat Beta Fix

on:
  push:
    branches:
      - fix/crossplatform-network-combat-beta
    paths:
      - '.github/workflows/apply-network-combat-beta-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/crossplatform-network-combat-beta
          fetch-depth: 0

      - name: Apply shared runtime patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found in {path}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'Apps/Source/RealmGate.Server/ServerNetworkHost.cs',
              '''        using var linked = CancellationTokenSource.CreateLinkedTokenSource(cancellationToken);\n        var endpoint = new IPEndPoint(_options.Network.ResolveBindAddress(), _options.Network.TelnetPort);\n        var listener = new TcpListener(endpoint);\n        listener.Start();\n        var clientDataTask = _clientData.RunAsync(linked.Token);\n        Console.WriteLine($"Telnet listener started on {endpoint.Address}:{endpoint.Port}; maxSessions={_options.Network.MaxSessions}");\n        Console.WriteLine($"MegaMUD legacy connection uses Telnet/game port {endpoint.Port}; RealmGate private client-data remains separate on port {_options.Network.ClientDataPort}.");''',
              '''        using var linked = CancellationTokenSource.CreateLinkedTokenSource(cancellationToken);\n        var listener = RealmGateNetworkBinding.StartListener(_options.Network.BindAddress, _options.Network.TelnetPort);\n        var endpoint = (IPEndPoint)listener.LocalEndpoint;\n        var clientDataTask = _clientData.RunAsync(linked.Token);\n        if (clientDataTask.IsCompleted)\n            await clientDataTask.ConfigureAwait(false);\n\n        Console.WriteLine("RealmGate server started.");\n        Console.WriteLine($"Listening on {endpoint.Address}:{endpoint.Port}");\n        foreach (var lanEndpoint in RealmGateNetworkBinding.DiscoverLanEndpoints(endpoint.Port))\n            Console.WriteLine($"LAN: {lanEndpoint}");\n        Console.WriteLine($"maxSessions={_options.Network.MaxSessions}");\n        Console.WriteLine($"MegaMUD legacy connection uses Telnet/game port {endpoint.Port}; RealmGate private client-data remains separate on port {_options.Network.ClientDataPort}.");''')

          replace(
              'Apps/Source/RealmGate.Server/ServerNetworkHost.cs',
              '''                    foreach (var pending in session.DrainMessages())\n                        await telnet.WriteLineAsync(pending, hostCancellationToken).ConfigureAwait(false);\n\n                    // MegaMUD path execution waits for the native MajorMUD-style status prompt.\n                    // Do not append a generic "> " prompt after room output; it prevents the client\n                    // from recognizing that movement completed and stalls imported .mp paths.\n                    if (pendingInput is null)\n                    {\n                        // Worldgroup modal state 0x88 owns its own prompt text. Do not append\n                        // the normal MajorMUD status prompt while the confirmation is pending.\n                        if (!session.HasClassicModalInput)\n                            await telnet.WriteAsync(_commands.RenderClassicPrompt(session), hostCancellationToken).ConfigureAwait(false);\n                        pendingInput = telnet.ReadLineAsync(hideInput: false, hostCancellationToken);\n                    }\n\n                    var completed = await Task.WhenAny(pendingInput, Task.Delay(100, hostCancellationToken)).ConfigureAwait(false);\n                    if (!ReferenceEquals(completed, pendingInput))\n                    {\n                        var liveMessages = session.DrainMessages();\n                        if (liveMessages.Count > 0)\n                        {\n                            await telnet.WriteLineAsync(hostCancellationToken).ConfigureAwait(false);\n                            foreach (var pending in liveMessages)\n                                await telnet.WriteLineAsync(pending, hostCancellationToken).ConfigureAwait(false);\n                            if (!session.HasClassicModalInput)\n                                await telnet.WriteAsync(_commands.RenderClassicPrompt(session), hostCancellationToken).ConfigureAwait(false);\n                        }\n                        continue;\n                    }''',
              '''                    var liveMessages = session.DrainMessages();\n                    if (liveMessages.Count > 0)\n                    {\n                        var promptAlreadyVisible = pendingInput is not null;\n                        var refreshPrompt = promptAlreadyVisible && !session.HasClassicModalInput\n                            ? _commands.RenderClassicPrompt(session)\n                            : null;\n                        var liveOutput = RuntimeTerminalOutputFormatter.ComposeAsynchronousOutput(\n                            liveMessages, refreshPrompt, promptAlreadyVisible);\n                        if (!string.IsNullOrEmpty(liveOutput))\n                            await telnet.WriteAsync(liveOutput, hostCancellationToken).ConfigureAwait(false);\n                    }\n\n                    // MegaMUD path execution waits for the native MajorMUD-style status prompt.\n                    // Do not append a generic "> " prompt after room output; it prevents the client\n                    // from recognizing that movement completed and stalls imported .mp paths.\n                    if (pendingInput is null)\n                    {\n                        // Worldgroup modal state 0x88 owns its own prompt text. Do not append\n                        // the normal MajorMUD status prompt while the confirmation is pending.\n                        if (!session.HasClassicModalInput)\n                            await telnet.WriteAsync(_commands.RenderClassicPrompt(session), hostCancellationToken).ConfigureAwait(false);\n                        pendingInput = telnet.ReadLineAsync(hideInput: false, hostCancellationToken);\n                    }\n\n                    var completed = await Task.WhenAny(pendingInput, Task.Delay(100, hostCancellationToken)).ConfigureAwait(false);\n                    if (!ReferenceEquals(completed, pendingInput))\n                        continue;''')

          replace(
              'Apps/Source/RealmGate.Server/ServerHostConfigurationAudit.cs',
              '.AddDefault("server:host:name", "RealmGate Local Host")\n            .AddDefault("server:host:bindAddress", "127.0.0.1")\n            .AddDefault("server:host:port", "4000")',
              '.AddDefault("server:host:name", "RealmGate Host")\n            .AddDefault("server:host:bindAddress", "0.0.0.0")\n            .AddDefault("server:host:port", "2323")')

          program = Path('Tools/RealmGateValidator/DotNet/Program.cs')
          text = program.read_text(encoding='utf-8-sig')
          anchor = '''if (args.Any(arg => string.Equals(arg, "--smoke-combat-completion", StringComparison.OrdinalIgnoreCase)))\n{'''
          addition = '''if (args.Any(arg => string.Equals(arg, "--smoke-network-binding", StringComparison.OrdinalIgnoreCase)))\n{\n    var networkReport = RuntimeNetworkBindingSmokeReport.Run();\n    Console.WriteLine("Runtime Network Binding Smoke Report");\n    Console.WriteLine(networkReport.ToJson());\n    return networkReport.Passed ? 0 : 98;\n}\n\nif (args.Any(arg => string.Equals(arg, "--smoke-combat-terminal", StringComparison.OrdinalIgnoreCase)))\n{\n    var terminalReport = RuntimeCombatTerminalSmokeReport.Run();\n    Console.WriteLine("Runtime Combat Terminal Smoke Report");\n    Console.WriteLine(terminalReport.ToJson());\n    return terminalReport.Passed ? 0 : 99;\n}\n\n'''
          if anchor not in text:
              raise SystemExit('Validator Program smoke anchor not found')
          program.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')

          validate = Path('Tools/RealmGateValidator/Validate.ps1')
          text = validate.read_text(encoding='utf-8-sig')
          anchor = '    @("megamud_connection", "--smoke-megamud-connection"),\n    @("classic_parity_closure", "--smoke-classic-parity-closure")'
          replacement = '    @("megamud_connection", "--smoke-megamud-connection"),\n    @("network_binding", "--smoke-network-binding"),\n    @("combat_terminal", "--smoke-combat-terminal"),\n    @("classic_parity_closure", "--smoke-classic-parity-closure")'
          if anchor not in text:
              raise SystemExit('Validate.ps1 smoke anchor not found')
          validate.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Remove one-time patch workflow
        shell: bash
        run: rm .github/workflows/apply-network-combat-beta-fix.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "RealmGate Beta Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Wire remote hosting and combat prompt refresh"
          git push origin HEAD:fix/crossplatform-network-combat-beta
