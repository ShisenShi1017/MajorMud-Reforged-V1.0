name: Apply Local Connection Fix

on:
  push:
    branches:
      - fix/crossplatform-network-combat-beta
    paths:
      - '.github/workflows/apply-local-connection-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/crossplatform-network-combat-beta
          fetch-depth: 0

      - name: Preserve local connection semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Apps/Source/RealmGate.Server/ServerNetworkHost.cs')
          text = p.read_text(encoding='utf-8-sig')

          old = '''        using var connection = client;\n        using var stream = connection.GetStream();\n        await using var telnet = new TelnetConnection(stream);'''
          new = '''        using var connection = client;\n        var remoteEndpoint = connection.Client.RemoteEndPoint as IPEndPoint;\n        var isLocalConnection = remoteEndpoint is not null && IPAddress.IsLoopback(remoteEndpoint.Address);\n        using var stream = connection.GetStream();\n        await using var telnet = new TelnetConnection(stream);'''
          if old not in text:
              raise SystemExit('Connection anchor not found')
          text = text.replace(old, new, 1)

          old = 'var account = await AuthenticateAccountAsync(telnet, linked.Token).ConfigureAwait(false);'
          new = 'var account = await AuthenticateAccountAsync(telnet, linked.Token, isLocalConnection).ConfigureAwait(false);'
          if old not in text:
              raise SystemExit('Authenticate call anchor not found')
          text = text.replace(old, new, 1)

          old = 'private async Task<RuntimeAccountRecord?> AuthenticateAccountAsync(TelnetConnection telnet, CancellationToken cancellationToken)'
          new = 'private async Task<RuntimeAccountRecord?> AuthenticateAccountAsync(TelnetConnection telnet, CancellationToken cancellationToken, bool isLocalConnection)'
          if old not in text:
              raise SystemExit('Authenticate signature anchor not found')
          text = text.replace(old, new, 1)

          old = '        var isLocalHost = IPAddress.IsLoopback(_options.Network.ResolveBindAddress());\n'
          new = '        var isLocalHost = isLocalConnection;\n'
          if old not in text:
              raise SystemExit('Local host anchor not found')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/apply-local-connection-fix.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "RealmGate Beta Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Preserve local client semantics on remote binds"
          git push origin HEAD:fix/crossplatform-network-combat-beta
