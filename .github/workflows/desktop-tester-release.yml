name: RealmGate Desktop Tester Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version, for example 0.2.0-beta.1'
        required: true
        default: '0.2.0-beta.3'
      create_release:
        description: 'Create a prerelease and attach both tester packages'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*-beta.*'
    branches:
      - main
    paths:
      # Updating this file is a deliberate one-time main-release request.
      - 'Tools/Release/release-request.txt'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout release request
        uses: actions/checkout@v4
      - name: Resolve requested version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$REQUESTED_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(cat Tools/Release/release-request.txt)"
          fi
          version="$(printf '%s' "$version" | tr -d '[:space:]' | sed 's/^v//')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run cross-platform client regression
        shell: pwsh
        run: dotnet run --project Tests/Source/RealmGate.Client.Core.Tests/RealmGate.Client.Core.Tests.csproj --configuration Release

      - name: Build self-contained tester package
        shell: pwsh
        run: >-
          ./Tools/Release/Build-RealmGateDesktopPackage.ps1
          -Version $env:RELEASE_VERSION
          -RuntimeIdentifier ${{ matrix.rid }}

      - name: Upload tester package
        uses: actions/upload-artifact@v4
        with:
          name: RealmGate-Desktop-${{ matrix.rid }}-${{ env.RELEASE_VERSION }}
          path: Release/DesktopPackages/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [version, package]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}

    steps:
      - name: Download tester packages
        uses: actions/download-artifact@v4
        with:
          pattern: RealmGate-Desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create or update prerelease
        shell: pwsh
        run: |
          $tag = if ($env:RELEASE_VERSION.StartsWith('v')) { $env:RELEASE_VERSION } else { "v$env:RELEASE_VERSION" }
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -eq 0) { throw 'No release assets were downloaded.' }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "RealmGate $tag" `
              --prerelease `
              --generate-notes
          }
