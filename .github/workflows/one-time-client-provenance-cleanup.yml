name: One-time client provenance cleanup

on:
  push:
    branches:
      - cleanup/remove-mudplay-license-dependency

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy client provenance references
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("Apps/Source/RealmGate.App/ViewModels/PlayViewModel.cs"): [
                  ("_mudPlayInventoryProfiles", "_inventoryAutomationProfiles"),
              ],
              Path("Apps/Source/RealmGate.App/Views/ReforgedPartyAutomationWindow.cs"): [
                  (
                      "/// RealmGate party status and coordination surface. It intentionally reuses the existing\n"
                      "/// ClientCoordinationService for permission-gated remote @ commands rather than\n"
                      "/// duplicating MudPlay's UI or remote-command model.",
                      "/// RealmGate party status and coordination surface. It reuses RealmGate's existing\n"
                      "/// ClientCoordinationService for permission-gated remote @ commands so party control\n"
                      "/// continues to have one RealmGate-owned authority path."
                  ),
              ],
              Path("Apps/Source/RealmGate.App/Views/ReforgedRecoveryAutomationWindow.cs"): [
                  (
                      "/// Reforged recovery/buff configuration window. The UI deliberately uses RealmGate's\n"
                      "/// own session model and terminology; it does not reproduce MudPlay's layout.",
                      "/// RealmGate recovery/buff configuration window. The UI uses RealmGate session state,\n"
                      "/// RealmGate terminology, and the RealmGate automation command-isolation path."
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"Expected cleanup text not found in {path}: {old[:80]!r}")
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8", newline="")

          notice = Path("ThirdPartyLicenses/MudPlay-LICENSE.txt")
          if notice.exists():
              notice.unlink()

          workflow = Path(".github/workflows/one-time-client-provenance-cleanup.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Verify legacy client provenance is absent
        shell: bash
        run: |
          if git grep -n -i -E 'mudplay|tehshortbus' -- .; then
            echo "Legacy client provenance text remains in the current tree."
            exit 1
          fi

      - name: Commit cleanup result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were needed."
            exit 0
          fi
          git commit -m "Remove legacy client license provenance"
          git push origin HEAD:${GITHUB_REF_NAME}
