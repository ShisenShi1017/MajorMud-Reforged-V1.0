name: Apply Item Data Root Fix

on:
  push:
    branches:
      - fix/crossplatform-network-combat-beta
    paths:
      - '.github/workflows/apply-item-data-root-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/crossplatform-network-combat-beta
          fetch-depth: 0

      - name: Use world data-root resolver for item catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Apps/Source/RealmGate.Server/RuntimeItemsEquipment.cs')
          text = p.read_text(encoding='utf-8-sig')
          old = '        var folder = Path.Combine(root, "Data", worldId);\n'
          new = '        var folder = ServerDataRootResolver.Resolve(root, worldId).DataRoot;\n'
          if old not in text:
              raise SystemExit('RuntimeItemCatalog data-root anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/apply-item-data-root-fix.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "RealmGate Beta Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Resolve item catalogs through configured world data roots"
          git push origin HEAD:fix/crossplatform-network-combat-beta
