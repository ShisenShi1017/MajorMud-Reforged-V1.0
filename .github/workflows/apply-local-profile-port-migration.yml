name: Apply Local Profile Port Migration

on:
  push:
    branches:
      - fix/crossplatform-network-combat-beta
    paths:
      - '.github/workflows/apply-local-profile-port-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/crossplatform-network-combat-beta
          fetch-depth: 0

      - name: Align built-in local profile port
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Apps/Source/RealmGate.App/Services/ClientConnectionProfileService.cs')
          text = p.read_text(encoding='utf-8-sig')

          anchor = 'using RealmGate.App.Models;\n'
          if anchor not in text:
              raise SystemExit('using anchor not found')
          text = text.replace(anchor, anchor + 'using RealmGate.Server;\n', 1)

          old = '            Port = session?.Port ?? 4000,\n'
          new = '            Port = session?.Port ?? RealmGateNetworkBinding.DefaultTelnetPort,\n'
          if old not in text:
              raise SystemExit('CreateNew port anchor not found')
          text = text.replace(old, new, 1)

          old = '''            profile.HostName = profile.HostName;\n            profile.Port = profile.Port;\n            profile.TerminalColumns = profile.TerminalColumns;'''
          new = '''            profile.HostName = profile.HostName;\n            if (string.Equals(profile.ProfileName, "Local Host Classic", StringComparison.OrdinalIgnoreCase)\n                && string.Equals(profile.ServerProfileName, "Local Host", StringComparison.OrdinalIgnoreCase)\n                && string.Equals(profile.HostName, RealmGateNetworkBinding.LocalOnlyAddress, StringComparison.OrdinalIgnoreCase)\n                && profile.Port == 4000)\n            {\n                // One-time migration of the historical built-in local profile only.\n                // User-created BBS profiles and explicitly customized endpoints are preserved.\n                profile.Port = RealmGateNetworkBinding.DefaultTelnetPort;\n            }\n            profile.TerminalColumns = profile.TerminalColumns;'''
          if old not in text:
              raise SystemExit('NormalizeCatalog port anchor not found')
          text = text.replace(old, new, 1)

          old = '''        HostName = "127.0.0.1",\n        Port = 4000,'''
          new = '''        HostName = RealmGateNetworkBinding.LocalOnlyAddress,\n        Port = RealmGateNetworkBinding.DefaultTelnetPort,'''
          if old not in text:
              raise SystemExit('default profile port anchor not found')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/apply-local-profile-port-migration.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "RealmGate Beta Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Migrate built-in local client profile to port 2323"
          git push origin HEAD:fix/crossplatform-network-combat-beta
