name: RealmGate Avalonia Desktop

on:
  push:
    branches:
      - main
      - port/avalonia-crossplatform-desktop
    paths:
      - 'Apps/Source/RealmGate.Desktop/**'
      - 'Apps/Source/RealmGate.Server/**'
      - 'Apps/Source/RealmGate.Server.Runtime/**'
      - 'Apps/Compiler/**'
      - 'Core/Source/RealmGate.Client.Core/**'
      - 'Tests/Source/RealmGate.Client.Core.Tests/**'
      - '.github/workflows/avalonia-desktop.yml'
  pull_request:
    paths:
      - 'Apps/Source/RealmGate.Desktop/**'
      - 'Apps/Source/RealmGate.Server/**'
      - 'Apps/Source/RealmGate.Server.Runtime/**'
      - 'Apps/Compiler/**'
      - 'Core/Source/RealmGate.Client.Core/**'
      - 'Tests/Source/RealmGate.Client.Core.Tests/**'
      - '.github/workflows/avalonia-desktop.yml'
  workflow_dispatch:

concurrency:
  group: avalonia-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run cross-platform client core ANSI regression
        run: dotnet run --project Tests/Source/RealmGate.Client.Core.Tests/RealmGate.Client.Core.Tests.csproj --configuration Release

      - name: Restore Avalonia desktop
        run: dotnet restore Apps/Source/RealmGate.Desktop/RealmGate.Desktop.csproj -r ${{ matrix.rid }}

      - name: Build Avalonia desktop
        run: dotnet build Apps/Source/RealmGate.Desktop/RealmGate.Desktop.csproj --configuration Release --no-restore -r ${{ matrix.rid }}

      - name: Publish Avalonia desktop
        run: dotnet publish Apps/Source/RealmGate.Desktop/RealmGate.Desktop.csproj --configuration Release --no-restore -r ${{ matrix.rid }} --self-contained false -o artifacts/${{ matrix.rid }}

      - name: Upload Avalonia desktop
        uses: actions/upload-artifact@v4
        with:
          name: RealmGate-Avalonia-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
