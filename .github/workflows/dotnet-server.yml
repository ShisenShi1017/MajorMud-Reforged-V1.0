name: Reforged Server Runtime

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore RealmGate.Server
        run: dotnet restore Apps/Source/RealmGate.Server/RealmGate.Server.csproj

      - name: Restore RealmGate.Validation
        run: dotnet restore Tools/RealmGateValidator/DotNet/RealmGate.Validation.csproj

      - name: Restore Librarium compiler
        run: dotnet restore Apps/Compiler/RealmGate.Compiler.csproj

      - name: Restore WCC ANSI parity tests
        run: dotnet restore Tests/Source/RealmGate.Server.AnsiParity.Tests/RealmGate.Server.AnsiParity.Tests.csproj

      - name: Build RealmGate.Server
        run: dotnet build Apps/Source/RealmGate.Server/RealmGate.Server.csproj --configuration Release --no-restore

      - name: Build RealmGate.Validation
        run: dotnet build Tools/RealmGateValidator/DotNet/RealmGate.Validation.csproj --configuration Release --no-restore

      - name: Build Librarium compiler
        run: dotnet build Apps/Compiler/RealmGate.Compiler.csproj --configuration Release --no-restore

      - name: Build WCC ANSI parity tests
        run: dotnet build Tests/Source/RealmGate.Server.AnsiParity.Tests/RealmGate.Server.AnsiParity.Tests.csproj --configuration Release --no-restore

      - name: Verify native WCC ANSI presentation contract
        run: dotnet run --project Tests/Source/RealmGate.Server.AnsiParity.Tests/RealmGate.Server.AnsiParity.Tests.csproj --configuration Release --no-build

      - name: Generate Classic runtime data
        run: dotnet run --project Apps/Compiler/RealmGate.Compiler.csproj --configuration Release --no-build -- build --world Classic --clean

      - name: Generate Custom1 runtime data
        run: dotnet run --project Apps/Compiler/RealmGate.Compiler.csproj --configuration Release --no-build -- build --world Custom1 --clean

      - name: Verify MegaMUD Telnet connection contract
        run: dotnet run --project Tools/RealmGateValidator/DotNet/RealmGate.Validation.csproj --configuration Release --no-build -- --smoke-megamud-connection

      - name: Verify portable network binding contract
        run: dotnet run --project Tools/RealmGateValidator/DotNet/RealmGate.Validation.csproj --configuration Release --no-build -- --smoke-network-binding

      - name: Verify combat completion terminal contract
        run: dotnet run --project Tools/RealmGateValidator/DotNet/RealmGate.Validation.csproj --configuration Release --no-build -- --smoke-combat-terminal

      - name: Verify combat completion gameplay contract
        run: dotnet run --project Tools/RealmGateValidator/DotNet/RealmGate.Validation.csproj --configuration Release --no-build -- --smoke-combat-completion

      - name: Verify Classic parity closure
        run: dotnet run --project Tools/RealmGateValidator/DotNet/RealmGate.Validation.csproj --configuration Release --no-build -- --smoke-classic-parity-closure

      - name: Bootstrap diagnostics
        run: dotnet run --project Apps/Source/RealmGate.Server/RealmGate.Server.csproj --configuration Release --no-build -- .