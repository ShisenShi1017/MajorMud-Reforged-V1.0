name: Reforged Cloud Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Restore and build Reforged source projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify rebranded project layout
        shell: bash
        run: |
          test -f Core/Source/Reforged.Core/Reforged.Core.csproj
          test -f Apps/Source/Reforged.Server/Reforged.Server.csproj
          test -f Apps/Source/Reforged.Importer/Reforged.Importer.csproj
          test -f Apps/Source/Reforged.Editor/Reforged.Editor.csproj
          test -f Apps/Source/Reforged.Launcher/Reforged.Launcher.csproj
          test -f Apps/Source/Reforged.Client/Reforged.Client.csproj
          if grep -R "Core/Source/MajorMud.Core\|Apps/Source/MajorMud\." -n .github/workflows; then
            echo "Old MajorMud project paths are still present in a workflow. Replace the workflow with this update's .github/workflows/dotnet-build.yml."
            exit 1
          fi

      - name: Restore Core
        run: dotnet restore Core/Source/Reforged.Core/Reforged.Core.csproj

      - name: Build Core
        run: dotnet build Core/Source/Reforged.Core/Reforged.Core.csproj --configuration Release --no-restore

      - name: Restore applications
        run: |
          dotnet restore Apps/Source/Reforged.Server/Reforged.Server.csproj
          dotnet restore Apps/Source/Reforged.Importer/Reforged.Importer.csproj
          dotnet restore Apps/Source/Reforged.Editor/Reforged.Editor.csproj
          dotnet restore Apps/Source/Reforged.Launcher/Reforged.Launcher.csproj
          dotnet restore Apps/Source/Reforged.Client/Reforged.Client.csproj

      - name: Build applications
        run: |
          dotnet build Apps/Source/Reforged.Server/Reforged.Server.csproj --configuration Release --no-restore
          dotnet build Apps/Source/Reforged.Importer/Reforged.Importer.csproj --configuration Release --no-restore
          dotnet build Apps/Source/Reforged.Editor/Reforged.Editor.csproj --configuration Release --no-restore
          dotnet build Apps/Source/Reforged.Launcher/Reforged.Launcher.csproj --configuration Release --no-restore
          dotnet build Apps/Source/Reforged.Client/Reforged.Client.csproj --configuration Release --no-restore
